# Build the Fabric 1.20.1 mod and publish reproducible workflow artifacts.
name: build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build mod and sources
        run: ./gradlew --no-daemon clean build
      - name: archive complete source tree
        run: git archive --format=zip --output=Chess-source.zip HEAD
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Chess-Fabric-1.20.1
          path: |
            build/libs/*.jar
            Chess-source.zip
          if-no-files-found: error
