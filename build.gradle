import java.awt.Color
import java.awt.Graphics2D
import java.awt.RenderingHints
import java.awt.image.BufferedImage

plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

repositories {
    maven {
        name = 'Geckolib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "chess" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-1.20.1:${project.geckolib_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName
    from("LICENSE") { rename { "${it}_${projectName}" } }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) { from components.java }
    }
    repositories {}
}

def generatedChessResources = layout.buildDirectory.dir("generated/chess-assets")
sourceSets.main.resources.srcDir(generatedChessResources)

tasks.register("generateChessAssets") {
    outputs.dir(generatedChessResources)
    doLast {
        File root = generatedChessResources.get().asFile
        root.mkdirs()
        def pieces = ["king", "ferz", "ladya", "el", "horse", "peshka"]
        def sides = ["white", "black"]
        def srcFigureTextures = file("src/main/resources/assets/chess/textures/figures")

        sides.each { side ->
            pieces.each { piece ->
                boolean isWhite = side == "white"
                Color fill = isWhite ? new Color(238, 229, 207) : new Color(42, 44, 52)
                Color edge = isWhite ? new Color(54, 49, 42) : new Color(225, 222, 211)
                File icon = new File(root, "assets/chess/textures/item/chess_${side}_${piece}.png")
                icon.parentFile.mkdirs()
                BufferedImage image = new BufferedImage(32, 32, BufferedImage.TYPE_INT_ARGB)
                Graphics2D g = image.createGraphics()
                g.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_OFF)
                g.setColor(new Color(0, 0, 0, 0)); g.fillRect(0, 0, 32, 32)
                g.setColor(fill); g.fillRect(5, 26, 22, 4); g.fillRect(8, 23, 16, 3)
                g.setColor(edge); g.drawRect(5, 26, 21, 3); g.drawRect(8, 23, 15, 2)
                switch (piece) {
                    case "king":
                        g.setColor(fill); g.fillRect(13, 8, 6, 15); g.fillRect(8, 12, 16, 5)
                        g.setColor(edge); g.drawRect(13, 8, 5, 14); g.drawRect(8, 12, 15, 4)
                        break
                    case "ferz":
                        g.setColor(fill); g.fillPolygon([7, 10, 12, 16, 20, 22, 25] as int[], [22, 12, 17, 7, 17, 12, 22] as int[], 7)
                        g.setColor(edge); g.drawPolygon([7, 10, 12, 16, 20, 22, 25] as int[], [22, 12, 17, 7, 17, 12, 22] as int[], 7)
                        [10,16,22].each { px -> g.fillRect(px - 1, 8, 3, 3) }
                        break
                    case "ladya":
                        g.setColor(fill); g.fillRect(9, 12, 14, 11); g.fillRect(7, 8, 5, 6); g.fillRect(14, 8, 5, 6); g.fillRect(21, 8, 4, 6)
                        g.setColor(edge); g.drawRect(9, 12, 13, 10); g.drawRect(7, 8, 4, 5); g.drawRect(14, 8, 4, 5); g.drawRect(21, 8, 3, 5)
                        break
                    case "el":
                        g.setColor(fill); g.fillPolygon([16, 8, 11, 21, 24] as int[], [5, 15, 23, 23, 15] as int[], 5)
                        g.setColor(edge); g.drawPolygon([16, 8, 11, 21, 24] as int[], [5, 15, 23, 23, 15] as int[], 5)
                        g.drawLine(12, 15, 20, 15)
                        break
                    case "horse":
                        g.setColor(fill); g.fillPolygon([8, 23, 22, 19, 20, 15, 11, 8] as int[], [23, 23, 13, 8, 5, 9, 8, 15] as int[], 8)
                        g.setColor(edge); g.drawPolygon([8, 23, 22, 19, 20, 15, 11, 8] as int[], [23, 23, 13, 8, 5, 9, 8, 15] as int[], 8)
                        g.fillRect(16, 11, 2, 2)
                        break
                    default:
                        g.setColor(fill); g.fillRect(12, 13, 8, 10); g.fillOval(10, 6, 12, 12)
                        g.setColor(edge); g.drawRect(12, 13, 7, 9); g.drawOval(10, 6, 11, 11)
                }
                g.dispose()
                javax.imageio.ImageIO.write(image, "png", icon)

                File texture = new File(root, "assets/chess/textures/figures/${side}_figures/${side}_${piece}.png")
                texture.parentFile.mkdirs()
                int textureSize = piece == "ladya" ? 64 : 32
                BufferedImage atlas = new BufferedImage(textureSize, textureSize, BufferedImage.TYPE_INT_ARGB)
                Color base = isWhite ? new Color(225, 216, 193) : new Color(55, 56, 61)
                Color highlight = isWhite ? new Color(241, 234, 216) : new Color(79, 80, 86)
                Color shade = isWhite ? new Color(188, 174, 148) : new Color(31, 32, 37)
                for (int py = 0; py < textureSize; py++) {
                    for (int px = 0; px < textureSize; px++) {
                        int band = (py % 16 < 2) ? -3 : ((py % 16 > 13) ? 2 : 0)
                        int grain = ((px * 17 + py * 31 + piece.hashCode()) % 9) - 4
                        boolean edgePixel = px % 16 == 0 || px % 16 == 15
                        Color source = (py % 16 < 3) ? highlight : (py % 16 > 12 ? shade : base)
                        int r = Math.max(0, Math.min(255, source.getRed() + grain + band - (edgePixel ? 5 : 0)))
                        int g = Math.max(0, Math.min(255, source.getGreen() + grain + band - (edgePixel ? 5 : 0)))
                        int b = Math.max(0, Math.min(255, source.getBlue() + grain + band - (edgePixel ? 5 : 0)))
                        atlas.setRGB(px, py, new Color(r, g, b).getRGB())
                    }
                }
                Graphics2D tg = atlas.createGraphics()
                tg.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_OFF)
                tg.setColor(highlight)
                tg.drawLine(1, 7, textureSize - 2, 7)
                tg.setColor(shade)
                tg.drawLine(1, 8, textureSize - 2, 8)
                if (piece == "king") {
                    tg.setColor(isWhite ? new Color(163, 130, 58) : new Color(193, 168, 104))
                    tg.fillRect(textureSize / 2 - 1, 1, 3, 5)
                    tg.fillRect(textureSize / 2 - 4, 2, 9, 2)
                } else if (piece == "ferz") {
                    tg.setColor(isWhite ? new Color(171, 135, 57) : new Color(203, 180, 116))
                    tg.fillRect(textureSize / 2 - 1, 1, 3, 3)
                    tg.fillRect(textureSize / 2 - 5, 3, 11, 2)
                } else if (piece == "ladya") {
                    tg.setColor(isWhite ? new Color(172, 144, 92) : new Color(190, 180, 157))
                    tg.fillRect(2, 2, textureSize - 4, 2)
                } else if (piece == "horse") {
                    tg.setColor(isWhite ? new Color(151, 122, 76) : new Color(190, 180, 157))
                    tg.drawLine(2, textureSize / 2, textureSize - 3, textureSize / 2 - 2)
                } else if (piece == "el") {
                    tg.setColor(isWhite ? new Color(171, 135, 57) : new Color(203, 180, 116))
                    tg.drawLine(2, 3, textureSize - 3, 3)
                }
                tg.dispose()
                javax.imageio.ImageIO.write(atlas, "png", texture)
            }
        }

        // Correct, non-missing chessboard tile textures. Top faces use the 16x16
        // upper-left area; thin vertical sides use the narrow 16x2 strip at y=16.
        ["white", "black"].each { side ->
            boolean lightTile = side == "white"
            Color wood = lightTile ? new Color(223, 203, 164) : new Color(92, 57, 38)
            Color border = lightTile ? new Color(148, 118, 79) : new Color(47, 30, 24)
            BufferedImage tile = new BufferedImage(16, 32, BufferedImage.TYPE_INT_ARGB)
            for (int y = 0; y < 32; y++) {
                for (int x = 0; x < 16; x++) {
                    Color color
                    if (y < 16) {
                        int grain = ((x * 13 + y * 7 + (lightTile ? 3 : 11)) % 7) - 3
                        int edge = (x == 0 || x == 15 || y == 0 || y == 15) ? -14 : 0
                        color = new Color(
                            Math.max(0, Math.min(255, wood.getRed() + grain + edge)),
                            Math.max(0, Math.min(255, wood.getGreen() + grain + edge)),
                            Math.max(0, Math.min(255, wood.getBlue() + grain + edge))
                        )
                        if (y == 5 || y == 11) color = new Color(
                            Math.max(0, color.getRed() - 4), Math.max(0, color.getGreen() - 4), Math.max(0, color.getBlue() - 4))
                    } else {
                        int sideShade = y < 18 ? -30 : -20
                        color = new Color(
                            Math.max(0, wood.getRed() + sideShade),
                            Math.max(0, wood.getGreen() + sideShade),
                            Math.max(0, wood.getBlue() + sideShade))
                    }
                    tile.setRGB(x, y, color.getRGB())
                }
            }
            Graphics2D boardGraphics = tile.createGraphics()
            boardGraphics.setColor(border)
            boardGraphics.drawLine(0, 0, 15, 0)
            boardGraphics.drawLine(0, 15, 15, 15)
            boardGraphics.drawLine(0, 16, 15, 16)
            boardGraphics.dispose()
            File boardTexture = new File(root, "assets/chess/textures/block/chess_${side}_square.png")
            boardTexture.parentFile.mkdirs()
            javax.imageio.ImageIO.write(tile, "png", boardTexture)
        }

    }
}

tasks.named("processResources").configure {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    dependsOn(tasks.named("generateChessAssets"))
    doLast {
        copy {
            from(generatedChessResources)
            include "assets/chess/textures/figures/**/*.png"
            include "assets/chess/textures/block/*.png"
            into(destinationDir)
        }
    }
}

tasks.named("sourcesJar").configure {
    dependsOn(tasks.named("generateChessAssets"))
}
